    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        console.error('Global Error: ' + message + ' at ' + source + ':' + lineno + ':' + colno + '\n' + (error ? error.stack : ''));
      };
      window.addEventListener('unhandledrejection', function(event) {
        console.error('Unhandled Promise Rejection: ' + (event.reason ? event.reason.message || event.reason : 'unknown'));
      });
    </script>
